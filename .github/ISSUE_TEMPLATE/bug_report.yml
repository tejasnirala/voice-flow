name: Bug report
description: Something doesn't work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please don't paste transcripts or recordings of anything private. VoiceFlow never logs what you say, and issues
        are public. For security or privacy problems, use a private advisory instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set mode to …
        2. Hold ⌥ and say …
        3. …
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >
        Menu bar → Copy Diagnostics (or `VoiceFlow --diagnostics` in Terminal) and paste it here. It contains versions,
        model and permission status and recent log lines — never your text.
      render: text
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac and macOS version
      placeholder: MacBook Air M4, macOS 27.0
    validations:
      required: true
